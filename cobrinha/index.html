<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cobrinha 3D</title>
<style>
  :root { --ciano: #22d3ee; --verde: #4ade80; --fundo: #0b1020; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--fundo); touch-action: none; }
  body { font: 600 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #e8f4ff; user-select: none; }
  canvas { display: block; }
  .hud { position: fixed; inset: 16px 20px auto; display: flex; justify-content: space-between; pointer-events: none;
         font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: #8aa4c0; }
  .hud b { display: block; font-size: 34px; letter-spacing: 0; color: #fff; font-variant-numeric: tabular-nums; }
  .hud div:last-child { text-align: right; }
  .painel { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; padding: 24px;
            background: radial-gradient(closest-side, rgba(11,16,32,.78), rgba(11,16,32,.2)); }
  .painel[hidden] { display: none; }
  h1 { font-size: clamp(40px, 9vw, 84px); letter-spacing: .04em; text-transform: uppercase; line-height: 1;
       background: linear-gradient(90deg, var(--verde), var(--ciano)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .painel p { color: #9db4cc; }
  .botao { justify-self: center; margin-top: 10px; padding: 12px 28px; border: 2px solid var(--ciano); border-radius: 999px;
           color: var(--ciano); background: transparent; font: inherit; letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
           transition: background .25s, color .25s; }
  .botao:hover, .botao:focus-visible { background: var(--ciano); color: var(--fundo); outline: none; }
</style>
</head>
<body>
<div class="hud">
  <div>Pontos<b id="pts">0</b></div>
  <div>Recorde<b id="rec">0</b></div>
</div>

<div class="painel" id="painel">
  <h1 id="titulo">Cobrinha 3D</h1>
  <p id="sub">Setas ou WASD · no celular, deslize o dedo</p>
  <button class="botao" id="jogar">Jogar</button>
  <p>Espaço começa · P pausa</p>
</div>

<script src="jogo.js"></script>
</body>
</html>
