<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cobrinha 3D</title>
<style>
  :root { --ciano: #22d3ee; --verde: #4ade80; --ouro: #fbbf24; --fundo: #0b1020; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--fundo); touch-action: none; }
  body { font: 600 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #e8f4ff; user-select: none; }
  canvas { display: block; }

  .hud { position: fixed; inset: 14px 18px auto; display: flex; justify-content: space-between; align-items: flex-start;
         gap: 12px; pointer-events: none; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #8aa4c0; }
  .hud b { display: block; font-size: 32px; letter-spacing: 0; color: #fff; font-variant-numeric: tabular-nums; }
  .hud small { display: block; font-size: 11px; letter-spacing: .08em; color: #6f8aa6; text-transform: none; }
  .hud__dir { text-align: right; }
  .hud__meio { display: grid; justify-items: center; gap: 8px; }

  .icone { pointer-events: auto; width: 40px; height: 40px; border-radius: 999px; border: 2px solid #2c4258;
           background: rgba(11,16,32,.6); color: #cfe6f5; font-size: 15px; cursor: pointer;
           transition: border-color .25s, color .25s; }
  .icone:hover, .icone:focus-visible { border-color: var(--ciano); color: var(--ciano); outline: none; }
  .icone[hidden] { display: none; }

  .poder { padding: 5px 14px; border-radius: 999px; border: 1px solid var(--ouro); color: var(--ouro);
           font-size: 11px; letter-spacing: .08em; text-transform: none; white-space: nowrap; }
  .poder[hidden] { display: none; }

  .aviso { position: fixed; inset: 104px 12px auto; text-align: center; color: var(--ouro);
           letter-spacing: .06em; pointer-events: none; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .aviso[hidden] { display: none; }

  .painel { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center;
            gap: 10px; padding: 24px; overflow: auto;
            background: radial-gradient(closest-side, rgba(11,16,32,.82), rgba(11,16,32,.25)); }
  .painel[hidden] { display: none; }
  h1 { font-size: clamp(34px, 8vw, 76px); letter-spacing: .04em; text-transform: uppercase; line-height: 1;
       background: linear-gradient(90deg, var(--verde), var(--ciano)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h2 { font-size: clamp(24px, 5vw, 40px); letter-spacing: .06em; text-transform: uppercase; color: var(--ciano); }
  .painel p { color: #9db4cc; }
  .painel p[hidden] { display: none; }

  .grupo { display: grid; gap: 10px; justify-items: center; margin-top: 6px; }
  .grupo[hidden] { display: none; }

  .botao { padding: 11px 24px; min-width: 240px; border: 2px solid var(--ciano); border-radius: 999px;
           color: var(--ciano); background: transparent; font: inherit; letter-spacing: .08em; text-transform: uppercase;
           cursor: pointer; transition: background .25s, color .25s, border-color .25s; }
  .botao:hover, .botao:focus-visible { background: var(--ciano); color: var(--fundo); outline: none; }
  .botao[hidden] { display: none; }
  .botao--fraco { border-color: #35506b; color: #a8c3da; }
  .botao--fraco:hover, .botao--fraco:focus-visible { background: #35506b; color: #eaf6ff; }
  .botao--ouro { border-color: var(--ouro); color: var(--ouro); }
  .botao--ouro:hover, .botao--ouro:focus-visible { background: var(--ouro); color: var(--fundo); }

  @media (max-height: 560px) { h1 { font-size: clamp(28px, 7vw, 44px); } .botao { padding: 9px 18px; } }
</style>
</head>
<body>
<div class="hud">
  <div>Pontos<b id="pts">0</b><small id="meta"></small></div>
  <div class="hud__meio">
    <button class="icone" id="pausa" title="Pausar" aria-label="Pausar" hidden>&#9208;</button>
    <div class="poder" id="poder" hidden></div>
  </div>
  <div class="hud__dir">Recorde<b id="rec">0</b><small id="saldo"></small></div>
</div>

<div class="aviso" id="aviso" hidden></div>

<div class="painel" id="painel">
  <h1 id="titulo">Cobrinha 3D</h1>
  <p id="sub">Escolha o nível</p>

  <div class="grupo" id="principal">
    <button class="botao botao--ouro" id="revToken" hidden></button>
    <button class="botao botao--ouro" id="revBanco" hidden></button>
    <button class="botao" id="jogar">Jogar</button>
    <button class="botao botao--fraco" id="abrirNiveis">Dificuldade</button>
    <button class="botao botao--fraco" id="menuConfig">Configurações</button>
  </div>

  <div class="grupo" id="acoes" hidden>
    <button class="botao" id="continuar">Continuar</button>
    <button class="botao botao--fraco" id="abrirConfig">Configurações</button>
    <button class="botao botao--fraco" id="sair">Sair para o menu</button>
  </div>

  <p id="dica">Setas ou WASD · deslize no celular · P pausa</p>
</div>

<div class="painel" id="pniveis" hidden>
  <h2>Dificuldade</h2>
  <p id="subNiveis">A meta muda, e com ela a velocidade e os obstáculos</p>
  <div class="grupo">
    <button class="botao" data-nivel="facil">Fácil · meta 15</button>
    <button class="botao" data-nivel="medio">Médio · meta 25</button>
    <button class="botao" data-nivel="dificil">Difícil · meta 40</button>
    <button class="botao botao--fraco" id="voltarNiveis">Voltar</button>
  </div>
</div>

<div class="painel" id="pconfig" hidden>
  <h2>Configurações</h2>
  <div class="grupo">
    <button class="botao botao--fraco" id="tSom">Som</button>
    <button class="botao botao--fraco" id="tAba">Pausar ao sair da aba</button>
    <button class="botao" id="fecharConfig">Voltar</button>
  </div>
</div>

<script src="jogo.js"></script>
</body>
</html>
